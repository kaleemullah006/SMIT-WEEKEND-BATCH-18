<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Practice</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>



    <input type="text" id="name" placeholder="Enter Your Name" class="show">
    <button id="nameNextBtn" class="show">NEXT</button>
    <p id="showName"></p>

    <div id="teamRapper" class="teamRapper hide">
        <div class="team" id="pk">Pakistan</div>
        <div class="team" id="bg">Bangladesh</div>
        <div class="team" id="sl">Srilanka</div>
        <div class="team" id="afg">Afghanistan</div>
        <div class="team" id="sa">South Africa</div>
        <div class="team" id="at">Apni Team</div>

        <button id="teamNextBtn" class="show">NEXT</button>
    </div>
    
    <div id="tossRapper" class="hide">
        <div class="toss" id="hd">Heads</div>
        <div class="toss" id="tl">Tails</div>
        <button id="tossNextBtn" class="show">NEXT</button>
    </div>
    
    <div id="choiceRapper" class="hide">
        <button id="batBtn">Batting</button>
        <button id="bowlBtn">Bowling</button>
        <button id="electedNextBtn" class="show">NEXT</button>

    </div>

    <div class="box"></div>







    <script src="app.js"></script>
</body>

</html>
